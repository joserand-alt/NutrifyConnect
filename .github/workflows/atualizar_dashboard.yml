name: Atualizar Painel Nutrify Connect

on:
  schedule:
    # Roda automaticamente de segunda a sexta às 07:00 e 13:00 BRT (10:00 e 16:00 UTC)
    - cron: '0 10,16 * * *'
  workflow_dispatch: # Permite atualizar manualmente pelo botão no GitHub a qualquer momento

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar varredura da API da Academy
        run: |
          python atualizar_dashboard_nutrify.py

      - name: Salvar dados atualizados no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html nutrify_connect_dashboard.html
          git diff --staged --quiet || (git commit -m "chore: atualização automática de dados via API [skip ci]" && git push)

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Upload do artefato HTML
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

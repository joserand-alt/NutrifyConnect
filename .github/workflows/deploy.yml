name: Sincronizacao Automatica das APIs & Deploy no GitHub Pages

on:
  schedule:
    # Executa a cada 2 horas (07h, 09h, 11h, 13h, 15h, 17h, 19h BRT)
    - cron: '0 */2 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "dash-sync-pipeline"
  cancel-in-progress: true

jobs:
  sync_and_deploy:
    env:
      TZ: America/Sao_Paulo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Sincronizar Matriculas e Disparar Tags no RD Station
        run: |
          python sync_matriculas_rd.py || echo "Aviso na sincronizacao de tags"

      - name: Executar Gerador e Consultar APIs (Academy, Cativa, Vindi, Asaas, RD)
        run: |
          python gerador.py

      - name: Salvar Caches e Dashboard Atualizado no Git
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard_gerado.html template.html *.json || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: atualização automática de dados via API [skip ci]" || true
            git push origin main || echo "Aviso: Push ignorado"
          else
            echo "Nenhuma alteracao detectada."
          fi

      - name: Keepalive - Evitar pausa do GitHub Actions por inatividade
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "${TIMESTAMP} - sync OK" > .last_sync
          git add .last_sync
          git commit -m "keepalive: ${TIMESTAMP} [skip ci]" || true
          git push origin main || true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload do artefato HTML
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
